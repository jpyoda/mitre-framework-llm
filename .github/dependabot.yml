version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR a week for routine updates instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep the Node types on the Node version in .nvmrc.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
